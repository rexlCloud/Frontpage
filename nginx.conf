server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # www.rexlcloud.de -> rexlcloud.de (nginx-proxy forwards both hosts here)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Hashed assets never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /de/ {
        error_page 404 /de/404/index.html;
        try_files $uri $uri/index.html $uri.html =404;
    }

    location / {
        error_page 404 /404.html;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
