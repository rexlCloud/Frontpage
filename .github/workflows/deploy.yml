name: Build and deploy

# Every push to main is built and then deployed with Docker Compose on the server.
# A new rexlCloud release redeploys the site too (from the rexlCloud release workflow), so the version
# number, the download links and the Javadoc follow the newest release.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          FETCH_STRICT: '1'
          ASTRO_TELEMETRY_DISABLED: '1'

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into server and redeploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # The key is bound to a fixed command on the server (/usr/local/bin/deploy-rexlcloud-frontpage:
          # git reset to origin/main, docker compose build + up), so this script itself is not executed.
          script: deploy
